<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 08: Modern Authentication & Session State Portal</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="auth-page-wrapper">
        <!-- Top App Navigation -->
        <header class="top-nav">
            <div class="brand">
                <span class="brand-badge">KEY</span>
                <span class="brand-text">NexusID Auth</span>
            </div>
            <a href="../index.html" class="nav-exit">← Lab Directory</a>
        </header>

        <main class="auth-card-container">
            <div class="auth-card">
                <!-- Tab Controls -->
                <div class="tab-control">
                    <button class="tab-btn active" id="tabSignIn" onclick="switchAuthMode('signin')">Sign In</button>
                    <button class="tab-btn" id="tabSignUp" onclick="switchAuthMode('signup')">Create Account</button>
                </div>

                <div class="auth-heading">
                    <h1 id="authTitle">Welcome Back</h1>
                    <p id="authSubtitle">Enter your credentials to access your developer workbench.</p>
                </div>

                <!-- Auth Form -->
                <form id="authForm" onsubmit="handleAuthSubmit(event)">
                    <div class="input-field" id="fullNameGroup" style="display: none;">
                        <label for="fullName">Full Name</label>
                        <input type="text" id="fullName" placeholder="e.g. Alex Morgan">
                    </div>

                    <div class="input-field">
                        <label for="userEmail">Email Address</label>
                        <input type="email" id="userEmail" placeholder="developer@domain.com" required autocomplete="email">
                    </div>

                    <div class="input-field">
                        <div class="label-row">
                            <label for="userPassword">Password</label>
                            <span class="toggle-pwd" onclick="togglePasswordVisibility()">Show</span>
                        </div>
                        <input type="password" id="userPassword" placeholder="••••••••••••" required minlength="8" autocomplete="current-password">
                    </div>

                    <button type="submit" class="btn-submit" id="submitBtn">Sign In to Dashboard</button>
                </form>

                <div class="auth-footer-links">
                    <span id="altPrompt">Need an account?</span>
                    <a href="#" id="altActionLink" onclick="toggleAlternativeMode()">Create one now</a>
                </div>

                <!-- Toast notification area -->
                <div class="toast-msg" id="authToast"></div>
            </div>
        </main>
    </div>

    <script src="auth.js"></script>
</body>
</html>
